<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>語音測試頁（暫時）</title>
<style>
  body { font-family: sans-serif; margin: 16px; line-height: 1.5; }
  button { font-size: 20px; padding: 10px 14px; margin: 4px 0; width: 100%; text-align: left; }
  .w { font-size: 14px; color: #555; }
  input { font-size: 20px; width: 100%; box-sizing: border-box; padding: 8px; }
</style>
</head>
<body>
<h1>語音測試頁（暫時，測完會移除）</h1>
<p>按每個按鈕聽一次，記下哪個唸成「ㄎㄚ ㄌㄧˇ」（課本讀音）。中間放了不同的字元，看語音會不會不把它當成語詞。</p>
<p class="w" id="info"></p>
<div id="list"></div>
<h2>自己輸入</h2>
<input id="custom" value="咖哩">
<button id="go">唸這一行</button>
<script>
/* 要測的寫法：標籤 → 要唸的文字（​ 零寬空格、⁠ 零寬連字、  不換行空格） */
const TESTS = [
  ["A 原本：咖哩", "咖哩"],
  ["B 中間放逗號：咖，哩", "咖，哩"],
  ["C 中間放頓號：咖、哩", "咖、哩"],
  ["D 中間放空格：咖 哩", "咖 哩"],
  ["E 中間放零寬空格", "咖​哩"],
  ["F 中間放零寬連字", "咖⁠哩"],
  ["G 中間放句點：咖。哩", "咖。哩"],
  ["H 單獨唸：咖", "咖"],
  ["I 單獨唸：哩", "哩"],
  ["J 咖哩 加「的咖」（目前題目唸法）", "咖哩的咖"],
  ["K 咖，哩的咖", "咖，哩的咖"],
  ["L 咖、哩的咖", "咖、哩的咖"],
  ["M 咖啡（對照，課本ㄎㄚ ㄈㄟ）", "咖啡"]
];
let voices = [];
const load = () => { try { voices = speechSynthesis.getVoices(); } catch (e) {} show(); };
const pick = () => voices.find(v => v.lang === "zh-TW" && /Google/i.test(v.name)) || voices.find(v => v.lang === "zh-TW")
  || voices.find(v => /zh[-_]TW/i.test(v.lang)) || voices.find(v => /^zh/i.test(v.lang)) || null;
const show = () => { const v = pick(); document.getElementById("info").textContent = "使用的語音：" + (v ? v.name + "（" + v.lang + "）" : "找不到中文語音，用瀏覽器預設"); };
if ("speechSynthesis" in window) { load(); speechSynthesis.onvoiceschanged = load; }
let last = null;
const say = text => {
  if (!("speechSynthesis" in window)) return;
  if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
  const u = last = new SpeechSynthesisUtterance(text);
  u.lang = "zh-TW"; const v = pick(); if (v) u.voice = v; u.rate = 0.9;
  setTimeout(() => { if (last === u) speechSynthesis.speak(u); }, 80);
};
const list = document.getElementById("list");
TESTS.forEach(([label, text]) => {
  const b = document.createElement("button"); b.textContent = label; b.onclick = () => say(text); list.appendChild(b);
});
document.getElementById("go").onclick = () => say(document.getElementById("custom").value);
</script>
</body>
</html>
