# 自動檢查（GitHub Actions）：每次發 PR、改 main 都會跑 docs/scripts/check.js
# 檢查程式語法、教材資料、版本號、學生資料、文件與效能等 11 項（見 check.js 開頭）；結果顯示在 PR 頁面（綠勾＝通過，紅叉＝有問題，點進去看哪一項）
# 本機也可以跑：在 repo 最上層執行 node docs/scripts/check.js
# 2026-10-24 加「網頁打得開測試」docs/scripts/smoke.js：用瀏覽器打開每一頁，有程式錯誤就不通過（放在同一個工作，Settings → Rules 不用另外設定）
name: 自動檢查
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    name: 自動檢查   # 名稱改了要同步 GitHub Settings → Rules 的「Require status checks to pass」（2026-10-24 從「程式、教材、版本號、學生資料」改名）
    runs-on: ubuntu-latest
    timeout-minutes: 10   # 2026-10-24 加網頁測試後從 5 分鐘放寬（裝瀏覽器約 1～2 分鐘）
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 抓完整紀錄，check.js 才能和 main 比「改了程式有沒有換版本號」（2026-10-24 加）
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node docs/scripts/check.js
      # 網頁打得開測試：裝 Playwright（自動操作瀏覽器的工具）和瀏覽器，再打開每一頁（2026-10-24 加）
      # 2026-11-02：版本固定在 package.json／package-lock.json（npm ci 照鎖定的版本裝），要升版就改 package.json 再執行 npm install
      - run: npm ci
      # 瀏覽器快取（2026-11-02 加）：瀏覽器檔案存起來，版本沒變就不用重新下載（以前偶爾卡在下載這步）。
      # 命中快取時只裝系統需要的函式庫（install-deps）；沒命中（第一次、或升 Playwright 版本後）才完整下載
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: node docs/scripts/smoke.js
